name: Package Windows capture agent

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-dev.txt -e . -r requirements-capture.txt -r requirements-packaging.txt
      - name: Lint the agent and project
        run: ruff check --select E4,E7,E9,F,I src tests tools
      - name: Run agent and Windows path regression tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_agent.py tests/test_cli.py::test_cli_replay_supports_relative_storage_directory
      - name: Build portable Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name pocket-packet-sniffer-agent
          --collect-data scapy
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --hidden-import=scapy.arch.windows
          src/pocket_packet_sniffer/agent.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $env:PPS_STORAGE_DIR = Join-Path $env:RUNNER_TEMP "pocket-packet-sniffer-smoke"
          $agent = Start-Process -FilePath "dist/pocket-packet-sniffer-agent.exe" -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($agent.HasExited) {
                throw "The capture agent exited during startup with code $($agent.ExitCode)."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "The packaged capture agent did not become healthy within 30 seconds."
            }
          } finally {
            if (-not $agent.HasExited) {
              Stop-Process -Id $agent.Id -Force
              $agent.WaitForExit()
            }
          }
      - name: Prepare downloadable archive
        shell: pwsh
        run: |
          Copy-Item tools/AGENT_WINDOWS_README.md dist/README.txt
          Compress-Archive -Path dist/pocket-packet-sniffer-agent.exe, dist/README.txt `
            -DestinationPath dist/pocket-packet-sniffer-agent-windows.zip -Force
      - name: Publish Windows agent release
        uses: softprops/action-gh-release@v2
        with:
          name: Pocket Packet Sniffer Windows Agent ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/pocket-packet-sniffer-agent-windows.zip

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development and capture dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-capture.txt
      - name: Install project in editable mode
        run: python -m pip install -e .
      - name: Lint Python source and tests
        run: ruff check --select E4,E7,E9,F,I src tests tools
      - name: Generate synthetic demo PCAP (Windows)
        if: runner.os == 'Windows'
        run: python tools/create_demo_pcap.py ci-demo.pcap
      - name: Replay synthetic demo PCAP (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer capture --pcap-file ci-demo.pcap --storage-dir ci-demo-captures --session-id ci-demo-session
      - name: Query demo packets (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer query --storage-dir ci-demo-captures --session-id ci-demo-session
      - name: Export demo report (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer export --storage-dir ci-demo-captures --session-id ci-demo-session --output ci-demo.csv
      - name: Run full test suite (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: python -m pytest -q --cov=pocket_packet_sniffer --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Run full test suite (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: python -m pytest -q --cov=pocket_packet_sniffer --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Publish Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  web-build:
    name: Build Next.js dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check dashboard
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test dashboard user flows
        run: npm run test:e2e

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development and capture dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-capture.txt
      - name: Install project in editable mode
        run: python -m pip install -e .
      - name: Lint Python source and tests
        run: ruff check --select E4,E7,E9,F,I src tests tools
      - name: Generate synthetic demo PCAP (Windows)
        if: runner.os == 'Windows'
        run: python tools/create_demo_pcap.py ci-demo.pcap
      - name: Replay synthetic demo PCAP (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer capture --pcap-file ci-demo.pcap --storage-dir ci-demo-captures --session-id ci-demo-session
      - name: Query demo packets (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer query --storage-dir ci-demo-captures --session-id ci-demo-session
      - name: Export demo report (Windows)
        if: runner.os == 'Windows'
        run: python -m pocket_packet_sniffer export --storage-dir ci-demo-captures --session-id ci-demo-session --output ci-demo.csv
      - name: Run full test suite (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Run relative-storage replay regression (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_cli.py::test_cli_replay_supports_relative_storage_directory

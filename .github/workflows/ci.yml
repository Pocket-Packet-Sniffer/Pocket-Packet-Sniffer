name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development and capture dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-capture.txt
      - name: Lint Python source and tests
        run: ruff check --select E4,E7,E9,F,I src tests tools
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -vv

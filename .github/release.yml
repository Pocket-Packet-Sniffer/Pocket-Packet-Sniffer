changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - type:feature
        - enhancement
    - title: Bug fixes
      labels:
        - type:bug
        - bug
    - title: Security and reliability
      labels:
        - type:security
        - type:quality
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Other changes
      labels:
        - "*"

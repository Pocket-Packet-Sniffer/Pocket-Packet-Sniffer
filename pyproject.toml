[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-packet-sniffer"
version = "0.2.2"
description = "Pocket Packet Sniffer passive capture, packet analysis, storage and CLI"
requires-python = ">=3.10"
dependencies = ["scapy>=2.5", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=7.1"]

[project.scripts]
pocket-packet-sniffer = "pocket_packet_sniffer.cli:main"
pocket-packet-sniffer-agent = "pocket_packet_sniffer.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
